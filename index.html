<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktivasi Kartu NFC Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <h1 id="heading" class="text-xl font-bold text-gray-900 mb-1 text-center">Memuat data kartu...</h1>
        <p id="subheading" class="text-sm text-gray-500 mb-6 text-center">Silakan tunggu sebentar.</p>

        <div id="form-box" class="hidden space-y-4">
            <!-- Kotak Petunjuk dengan Link Productmate -->
            <div class="bg-blue-50 border border-blue-200 text-blue-800 text-xs p-3 rounded-lg leading-relaxed">
                <span class="font-semibold block mb-1">💡 Petunjuk Aktivasi:</span>
                1. Masukkan nama usaha atau bisnis Anda.<br>
                2. Belum punya link review? <a href="https://productmate.com/google-review-link-generator" target="_blank" class="text-blue-600 underline font-semibold hover:text-blue-800">Klik di sini untuk Generate Link Google Review</a>.<br>
                3. Salin dan tempel link hasil generate tersebut pada kolom di bawah.
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Nama Bisnis / Usaha</label>
                <input type="text" id="business-name" placeholder="Contoh: Coffee Shop Sukses" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Link Google Review</label>
                <input type="url" id="review-url" placeholder="https://..." class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button onclick="activateCard()" id="btn-activate" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition">
                Aktifkan Kartu Sekarang
            </button>
        </div>
    </div>

    <script>
        // Ganti dengan URL /exec Apps Script Anda
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHmoa3TBgAwEACtHqBOLpaTbUxykKTdQe5gRRtKxQlKntHO7Rvg6tmu4wbvmmAyfm0/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if (!productId) {
            document.getElementById('heading').textContent = "Product ID Tidak Ditemukan";
            document.getElementById('subheading').textContent = "Gunakan format link yang benar, contoh: ?id=NFC-001";
        } else {
            document.getElementById('subheading').textContent = `Product ID: ${productId}`;

            fetch(`${SCRIPT_URL}?action=get_product&product_id=${productId}`)
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        if (res.data.status === "activated") {
                            window.location.replace(res.data.google_review_url);
                        } else {
                            document.getElementById('heading').textContent = "Aktifkan Kartu Anda";
                            document.getElementById('form-box').classList.remove('hidden');
                        }
                    } else {
                        document.getElementById('heading').textContent = "Kartu Tidak Terdaftar";
                        document.getElementById('subheading').textContent = `ID "${productId}" tidak ditemukan di database.`;
                    }
                })
                .catch(() => {
                    document.getElementById('heading').textContent = "Kesalahan Koneksi";
                    document.getElementById('subheading').textContent = "Gagal terhubung ke server database.";
                });
        }

        function activateCard() {
            const businessName = document.getElementById('business-name').value.trim();
            const reviewUrl = document.getElementById('review-url').value.trim();
            const btn = document.getElementById('btn-activate');

            if (!businessName) {
                alert("Silakan masukkan Nama Bisnis terlebih dahulu!");
                return;
            }
            if (!reviewUrl) {
                alert("Silakan masukkan URL Google Review terlebih dahulu!");
                return;
            }

            btn.textContent = "Menyimpan...";
            btn.disabled = true;

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ 
                    action: "activate", 
                    product_id: productId, 
                    google_review_url: reviewUrl,
                    business_name: businessName
                })
            })
            .then(res => res.json())
            .then(result => {
                if (result.success || result.message === "Activated successfully") {
                    alert("Berhasil diaktifkan! Mengalihkan ke Google Review...");
                    window.location.replace(reviewUrl);
                } else {
                    alert("Gagal mengaktifkan data.");
                    btn.textContent = "Aktifkan Kartu Sekarang";
                    btn.disabled = false;
                }
            })
            .catch(() => {
                alert("Terjadi kesalahan jaringan.");
                btn.textContent = "Aktifkan Kartu Sekarang";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
