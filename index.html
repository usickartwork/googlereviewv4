<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beri Ulasan Kami</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .star-btn { transition: transform 0.1s ease; }
        .star-btn:hover { transform: scale(1.15); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-0 md:p-4">

    <!-- Elemen Audio Pendek untuk Efek Klik Bintang -->
    <audio id="pop-sound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>

    <!-- Container Utama -->
    <div id="main-container" class="w-full max-w-md min-h-screen md:min-h-0 bg-white md:rounded-2xl md:shadow-sm md:border md:border-slate-100 p-6 sm:p-8 text-center flex flex-col justify-center">
        
        <!-- LOGO BRAND (Hanya tampil saat form aktivasi) -->
        <div id="logo-box" class="mb-6">
            <img src="logo.png" alt="Logo Brand" class="h-24 w-auto mx-auto object-contain">
        </div>

        <h1 id="heading" class="text-xl font-bold text-slate-900 mb-1">Memuat...</h1>
        <p id="subheading" class="text-sm text-slate-500 mb-6">Mohon tunggu sebentar.</p>

        <!-- Form Aktivasi -->
        <div id="form-box" class="hidden space-y-4 text-left">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Bisnis / Usaha</label>
                <input type="text" id="business-name" placeholder="Contoh: Coffee Shop Sukses" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Link Kontak WhatsApp Owner</label>
                <input type="url" id="owner-wa-link" placeholder="https://wa.me/628xxxxxxxxxx" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Link Google Review</label>
                <input type="url" id="review-url" placeholder="https://search.google.com/..." class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                
                <p class="text-[11px] text-slate-400 mt-1.5 leading-relaxed">
                    Belum punya link? <a href="https://productmate.com/google-review-link-generator" target="_blank" class="text-blue-600 underline font-medium hover:text-blue-800">Convert link gmaps ke Google Review di sini</a>.
                </p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">PIN Keamanan</label>
                <input type="text" id="card-pin" placeholder="Contoh: 1234" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none">
            </div>

            <button onclick="activateCard()" id="btn-activate" class="w-full bg-blue-600 text-white font-medium py-3 rounded-xl hover:bg-blue-700 transition shadow-sm mt-2">
                Aktifkan Kartu Sekarang
            </button>
        </div>

        <!-- Halaman Utama (Rating - Full Frame Vertikal & Beraksen Biru) -->
        <div id="rating-page" class="hidden space-y-6">
            
            <div class="text-center space-y-2 cursor-pointer select-none" onclick="handleSecretResetClick()" title="Ketuk 5 kali untuk ubah data">
                <div class="w-10 h-1 bg-blue-600 mx-auto rounded-full mb-3"></div>
                <h1 id="display-business" class="text-3xl font-extrabold text-slate-900 tracking-tight"></h1>
                <p class="text-xs text-slate-500 font-medium px-4">Terima kasih telah berkunjung! Kami sangat menghargai dukungan Anda.</p>
                <p class="text-[11px] text-blue-600 uppercase tracking-widest font-bold pt-1">Berikan Ulasan Anda</p>
            </div>

            <!-- Bintang -->
            <div class="flex justify-center gap-3 py-2" id="star-container">
                <button onclick="handleRating(1)" class="star-btn text-5xl text-slate-200 focus:outline-none">★</button>
                <button onclick="handleRating(2)" class="star-btn text-5xl text-slate-200 focus:outline-none">★</button>
                <button onclick="handleRating(3)" class="star-btn text-5xl text-slate-200 focus:outline-none">★</button>
                <button onclick="handleRating(4)" class="star-btn text-5xl text-slate-200 focus:outline-none">★</button>
                <button onclick="handleRating(5)" class="star-btn text-5xl text-slate-200 focus:outline-none">★</button>
            </div>

            <div id="bad-review-section" class="hidden space-y-3 text-left bg-blue-50/40 border border-blue-100 p-4 rounded-2xl">
                <p class="text-xs font-semibold text-slate-700">Mohon maaf, apa yang bisa diperbaiki?</p>
                <textarea id="feedback-msg" rows="3" placeholder="Tulis masukan Anda..." class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-600 outline-none bg-white"></textarea>
                <button onclick="sendPrivateFeedbackToWhatsApp()" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-xl text-xs hover:bg-blue-700 transition shadow-sm">
                    💬 Kirim Masukan ke WhatsApp Owner
                </button>
            </div>

            <div id="good-review-section" class="hidden space-y-3 text-center bg-blue-50/60 border border-blue-100 p-4 rounded-2xl">
                <p class="text-xs font-semibold text-blue-900">Terima kasih atas penilaian positif Anda!</p>
                <a id="google-review-btn" href="#" target="_blank" class="block w-full bg-blue-600 text-white font-medium py-2.5 rounded-xl text-xs hover:bg-blue-700 transition font-semibold shadow-sm">
                    ⭐ Kirim Ulasan Anda
                </a>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrDzMoosfaQu-CT4wnw7avyWFusNpw2ylo4IWmYbO53021t_20FGx5La8YP9Rds0Ym/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        let targetReviewUrl = "", ownerWaLink = "", selectedStarRating = 0;
        let secretClickCount = 0;
        let secretClickTimer = null;

        if (!productId) {
            document.getElementById('logo-box').classList.add('hidden');
            document.getElementById('heading').textContent = "Product ID Tidak Ditemukan";
            document.getElementById('subheading').textContent = "Gunakan format link yang benar.";
        } else {
            document.getElementById('logo-box').classList.add('hidden');

            fetch(`${SCRIPT_URL}?action=get_product&product_id=${productId}`)
                .then(res => res.json())
                .then(res => {
                    if (res.success && res.data.status === "activated") {
                        targetReviewUrl = res.data.google_review_url;
                        ownerWaLink = res.data.whatsapp_link;
                        
                        document.getElementById('heading').classList.add('hidden');
                        document.getElementById('subheading').classList.add('hidden');
                        
                        const container = document.getElementById('main-container');
                        container.className = "w-full max-w-md min-h-screen bg-white p-6 sm:p-8 text-center flex flex-col justify-center";

                        document.getElementById('rating-page').classList.remove('hidden');
                        document.getElementById('display-business').textContent = res.data.business_name;
                    } else {
                        document.getElementById('logo-box').classList.remove('hidden');
                        document.getElementById('form-box').classList.remove('hidden');
                        document.getElementById('heading').textContent = "Aktifkan Kartu Anda";
                        document.getElementById('subheading').textContent = "Silakan lengkapi data di bawah ini.";
                    }
                })
                .catch(() => {
                    document.getElementById('heading').textContent = "Kesalahan Koneksi";
                    document.getElementById('subheading').textContent = "Gagal terhubung ke server database.";
                });
        }

        // Fungsi Memutar Suara Klik Bintang
        function playStarSound() {
            const sound = document.getElementById('pop-sound');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio diblokir browser:", e));
            }
        }

        function handleSecretResetClick() {
            secretClickCount++;
            if (secretClickTimer) clearTimeout(secretClickTimer);
            secretClickTimer = setTimeout(() => { secretClickCount = 0; }, 2000);

            if (secretClickCount >= 5) {
                secretClickCount = 0;
                clearTimeout(secretClickTimer);
                
                const pin = prompt("🔐 Menu Reset Data Kartu\nMasukkan PIN keamanan kartu ini:");
                if (pin === null || !pin.trim()) return;

                fetch(`${SCRIPT_URL}?action=reset&product_id=${productId}&pin=${encodeURIComponent(pin)}`)
                    .then(res => res.json())
                    .then(result => {
                        if (result.success) {
                            alert("PIN benar! Kartu berhasil direset.");
                            location.reload();
                        } else {
                            alert("Gagal: " + (result.message || "PIN salah!"));
                        }
                    })
                    .catch(() => alert("Terjadi kesalahan jaringan."));
            }
        }

        function handleRating(rating) {
            selectedStarRating = rating;
            playStarSound(); // Memanggil suara klik
            
            document.querySelectorAll('.star-btn').forEach((s, i) => s.className = `star-btn text-5xl focus:outline-none ${i < rating ? 'text-amber-400' : 'text-slate-200'}`);
            document.getElementById('bad-review-section').classList.toggle('hidden', rating > 3);
            document.getElementById('good-review-section').classList.toggle('hidden', rating <= 3);
            if (rating > 3) document.getElementById('google-review-btn').href = targetReviewUrl;
        }

        function sendPrivateFeedbackToWhatsApp() { window.location.href = ownerWaLink.trim(); }

        function activateCard() {
            const reviewUrl = document.getElementById('review-url').value.trim();

            if (!reviewUrl.startsWith("https://search.google.com/")) {
                alert("Link Google Review tidak valid!\n\nPastikan Anda menggunakan link resmi dari ProductMate yang diawali dengan 'https://search.google.com/'.");
                document.getElementById('review-url').focus();
                return;
            }

            const data = { 
                action: "activate", 
                product_id: productId, 
                google_review_url: reviewUrl, 
                business_name: document.getElementById('business-name').value, 
                pin: document.getElementById('card-pin').value, 
                whatsapp_link: document.getElementById('owner-wa-link').value 
            };

            fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(data) }).then(() => location.reload());
        }
    </script>
</body>
</html>
